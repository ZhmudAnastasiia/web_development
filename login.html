<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логін</title>
    <link rel="stylesheet" href="css/login_style.css">
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <div class="input-group">
            <img src="./assets/letter.png" alt="letter" class="icon">
            <input type="email" placeholder="Email">
        </div>
        <div class="input-group">
            <img src="./assets/password.png" alt="password" class="icon">
            <input type="password" id="password" placeholder="Password">
            <span class="toggle-password"><img src="assets/crossed-eye.png" alt="crossed-eye"></span>
        </div>
        <a href="#" class="forgot-password">Забули пароль?</a>
        <button class="btn" onclick="window.location.href='trip_list.html'">Login</button>
        <p class="login-link">Ще не маєте облікового запису?<br><a href="registration.html">Зареєструватись</a></p>
    </div>
</body>
</html>
