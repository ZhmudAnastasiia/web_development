<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="./css/registration_style.css">
</head>
<body>
    <div class="container">
        <h2>Реєстрація</h2>
        <div class="input-group">
            <img src="./assets/user.png" alt="user" class="icon">
            <input type="text" placeholder="Ім'я">
        </div>
        <div class="input-group">
            <img src="./assets/letter.png" alt="letter" class="icon">
            <input type="email" placeholder="Email">
        </div>
        <div class="input-group">
            <img src="./assets/password.png" alt="password" class="icon">
            <input type="password" id="password" placeholder="Пароль">
            <img src="assets/crossed-eye.png" alt="toggle password" class="toggle-password">
        </div>
        <div class="input-group">
            <img src="assets/password.png" alt="password" class="icon">
            <input type="password" id="confirm-password" placeholder="Підтвердити пароль">
            <img src="assets/crossed-eye.png" alt="toggle password" class="toggle-password">
        </div>
        <button class="btn" onclick="window.location.href='trip_list.html'">Реєстрація</button>
        <p class="login-link">Вже зареєстровані? <a href="login.html">Увійти</a></p>
    </div>
</body>
</html>
